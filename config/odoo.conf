[options]
; Senha mestra para gerenciamento de bancos de dados via interface web
admin_passwd = master_admin_password_2026

; Dados de conexão com o contêiner do PostgreSQL
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secure_password_2026

; Caminho onde o Odoo buscará os módulos (nativos e customizados do CORE ERP)
addons_path = /usr/lib/python3/site-packages/odoo/addons,/mnt/extra-addons

; Limites de segurança e performance para desenvolvimento
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200